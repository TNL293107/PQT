[project]
name = "personal-quant"
version = "0.1.0"
description = "Quantitative research layer for the Personal Quant Terminal."
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Three runtime dependencies, each added because nothing else can do its job.
#
# pyarrow (U6) reads the canonical dataset's Parquet. Everything the momentum
# vertical slice computes — a 12-1 return, a rank, a decile mean, a rank
# correlation — runs on the standard library over a few dozen names, and
# prices stay Decimal as the dataset contract stores them.
#
# duckdb (U7) is the analytical tier: SQL over a verified build, embedded, no
# server. It is fed the verified bytes as Arrow, never a path, and keeps prices
# DECIMAL. The floor is the oldest release the tests, its file-access
# lockdown among them, were run against (1.5.0; also 1.5.6).
#
# psycopg (U10) is how the quant worker reaches research.jobs, connected as
# the quant_research role. It is a driver, not an ORM: the worker's SQL is
# three statements, and the schema belongs to the backend's migrations.
#
# numpy, polars and the rest arrive when a computation needs them (Phase 7),
# not before: a dependency added before a computation justifies it is one
# nobody can argue for removing later.
dependencies = [
    "pyarrow>=18",
    "duckdb>=1.5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pyyaml>=6",
    "types-PyYAML>=6",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
# Qlib, research only (U8, ADR-017): the model zoo behind PQT's Model
# protocol, imported only by personal_quant.integrations.qlib. Never a base
# dependency — the package and its tests run without it, and the adapter's
# tests skip. Pinned exactly, because a run records the engine version that
# produced it (research_engine_version) and the last tagged release is slow
# to move. pyqlib 0.9.7 publishes wheels for CPython 3.8–3.12 only, so this
# extra needs a 3.12 interpreter; it brings LightGBM, pandas and MLflow, all
# of which stay inside the adapter.
research = [
    "pyqlib==0.9.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "S",    # bandit security rules
    "ANN",  # missing annotations
    "D",    # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how pytest expresses expectations.
# S105/S106: test fixtures use obviously-fake credentials on purpose; the
#            point of several tests is that such a value is handled safely.
# D100/D103: module and test-function docstrings; the test name is the
#            description.
"tests/**" = ["S101", "S105", "S106", "D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# pyarrow ships no type information. Its use is confined to reading the
# dataset's columns in personal_quant.research.datasets, which converts them
# to typed Bars at once, so nothing untyped travels further.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Qlib ships no type information, and none of Qlib, MLflow or pandas is
# installed without the research extra. All three are imported only inside
# personal_quant.integrations.qlib, which converts everything they return to
# builtins before it leaves, so nothing untyped travels further.
[[tool.mypy.overrides]]
module = ["qlib", "qlib.*", "mlflow", "mlflow.*", "pandas", "pandas.*"]
ignore_missing_imports = true
