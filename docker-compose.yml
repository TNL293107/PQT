# Development environment for the Personal Quant Terminal.
#
#   cp .env.example .env      (PowerShell: Copy-Item .env.example .env)
#   docker compose up --build
#
# Then:
#   terminal   http://localhost:3000
#   API        http://localhost:8080/health
#              http://localhost:8080/health/ready
#              http://localhost:8080/scalar/v1     (Development only)
#
# This file describes a development environment. It is not a deployment
# manifest: ports are published to the host, the API migrates its own schema
# on start, and OpenAPI is exposed.

name: personal-quant-terminal

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — system of record.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # ':?' makes a missing value a startup error with a readable message,
      # instead of a database that silently comes up without a password.
      POSTGRES_DB: ${POSTGRES_DATABASE:?set POSTGRES_DATABASE in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — copy .env.example to .env}
      # Postgres refuses to initialise a data directory that is not empty and
      # not its own; keeping PGDATA in a subdirectory avoids that on bind
      # mounts and on volume reuse.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -q and the explicit user/db avoid a false pass during the brief window
      # when the init script has started the server on a temporary socket.
      test:
        ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — cache, ephemeral state, and later pub/sub.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only persistence so a restart during development does not lose
    # whatever state is being inspected.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Backend — ASP.NET Core modular monolith.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: src/PersonalQuant.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}

      # Flat .env values are mapped onto the hierarchical configuration keys
      # the API binds. Host and port are the in-network values, not the
      # published ones — inside the Compose network the database is always
      # reachable at postgres:5432.
      Postgres__Host: postgres
      Postgres__Port: "5432"
      Postgres__Database: ${POSTGRES_DATABASE:?set POSTGRES_DATABASE in .env}
      Postgres__Username: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      Postgres__Password: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The database is disposable here, so the API brings its own schema up.
      Postgres__ApplyMigrationsOnStartup: "true"
      # And its own reference data, so instrument search has something to find
      # on a first run. Creates missing rows only; never modifies existing ones.
      Postgres__SeedReferenceDataOnStartup: "true"

      Redis__Host: redis
      Redis__Port: "6379"

      # Reference-data and market-data sources. The paths point at the tracked
      # fixtures inside the read-only mount below, so the pipelines can be run
      # on a fresh clone without a vendor key.
      #
      # Both switches are OFF by default and that is deliberate: starting the
      # API should not begin reading external sources.
      #
      # The calendar is real — 2022-2026, transcribed from the exchange's own
      # annual holiday notices — so completeness can be measured once the
      # import is enabled. It ends where the notices end.
      #
      # VietcapBaseUrl is empty by default because setting it registers a
      # source that reaches a third party over the network. That source serves
      # prices ALREADY ADJUSTED for corporate actions; it declares so, and the
      # read path returns such a series unrescaled. See ADR-015.
      #
      # The fixture corporate actions are invented and concern only DEMO, the
      # security the fixture bar series describes. They exist so the adjustment
      # engine runs end to end; point CorporateActionPath at real action
      # history before trusting an adjusted price.
      MarketData__InstrumentListPath: ${MARKET_DATA_INSTRUMENT_LIST:-/app/data/fixtures/instruments.csv}
      MarketData__FileProviderDirectory: ${MARKET_DATA_BAR_DIRECTORY:-/app/data/fixtures/market-data}
      MarketData__TradingCalendarPath: ${MARKET_DATA_CALENDAR:-/app/data/fixtures/trading-calendar.csv}
      MarketData__TradingCalendarCoveragePath: ${MARKET_DATA_CALENDAR_COVERAGE:-/app/data/fixtures/trading-calendar-coverage.csv}
      MarketData__CorporateActionPath: ${MARKET_DATA_CORPORATE_ACTIONS:-/app/data/fixtures/corporate-actions.csv}
      MarketData__UniverseDirectory: ${MARKET_DATA_UNIVERSES:-/app/data/fixtures/universes}
      MarketData__VietcapBaseUrl: ${MARKET_DATA_VIETCAP_URL:-}
      MarketData__CafefBaseUrl: ${MARKET_DATA_CAFEF_URL:-}
      MarketData__IngestionSource: ${MARKET_DATA_INGESTION_SOURCE:-}
      MarketData__ImportReferenceDataOnStartup: ${MARKET_DATA_IMPORT_ON_STARTUP:-false}
      MarketData__IngestOnSchedule: ${MARKET_DATA_INGEST_ON_SCHEDULE:-false}
      MarketData__IngestionPeriodMinutes: ${MARKET_DATA_INGESTION_PERIOD_MINUTES:-60}
      MarketData__InitialBackfillDays: ${MARKET_DATA_BACKFILL_DAYS:-365}
      MarketData__IngestionUniverseLimit: ${MARKET_DATA_UNIVERSE_LIMIT:-250}
      MarketData__IngestionTickers: ${MARKET_DATA_INGESTION_TICKERS:-}

      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      # Read-only: the container reads reference data and exports, and must not
      # be able to write into the repository that supplies them.
      - ./data:/app/data:ro
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # Liveness, not readiness: the container is healthy when the process
      # answers, even while a dependency is still settling.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend — React terminal, compiled and served by nginx.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time. It is the URL the browser uses, so
        # it is the published host port, not the in-network service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
  redis-data:
